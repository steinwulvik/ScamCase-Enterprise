<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ScamCase Enterprise: concept demo for handling bank fraud claims (impersonation fraud, PSR) at the fictional Morild Bank.">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ScamCase Enterprise for Morild Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app-skall med fast sidemeny (løsningsforslag + demo), arbeidsflate til høyre. Morild = havlys: dyp blågrønn blekk, lysende turkis aksent, rav for frister. */
:root{
  --bg:#F2F6F7; --surface:#FFFFFF; --surface-2:#E8EFF1; --ink:#0E2430; --muted:#4D6472; --line:#D2DDE2;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --accent-soft:#D6EDEF; --glow:#1FA897;
  --ok:#1C7343; --ok-soft:#DBF0E3; --warn:#8F5400; --warn-soft:#FBEACB; --bad:#AE2A21; --bad-soft:#F7DDDA; --info:#3755A2; --info-soft:#E0E6F6;
  --side:#0E2430; --side-ink:#D9E7EC; --side-muted:#8FA9B6; --side-hi:#16384A;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r:8px; --r-s:5px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A161D; --surface:#0F2230; --surface-2:#15303F; --ink:#E2EDF1; --muted:#9AB0BC; --line:#23404F;
  --accent:#4BC2C6; --accent-ink:#04222A; --accent-soft:#123E46; --glow:#5FDDC9;
  --ok:#5CC78A; --ok-soft:#133826; --warn:#EFB04A; --warn-soft:#3B2B10; --bad:#F2847B; --bad-soft:#421B18; --info:#90A9F0; --info-soft:#1B2A4C;
  --side:#071117; --side-ink:#D9E7EC; --side-muted:#7E98A5; --side-hi:#123041;
  color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0A161D; --surface:#0F2230; --surface-2:#15303F; --ink:#E2EDF1; --muted:#9AB0BC; --line:#23404F;
  --accent:#4BC2C6; --accent-ink:#04222A; --accent-soft:#123E46; --glow:#5FDDC9;
  --ok:#5CC78A; --ok-soft:#133826; --warn:#EFB04A; --warn-soft:#3B2B10; --bad:#F2847B; --bad-soft:#421B18; --info:#90A9F0; --info-soft:#1B2A4C;
  --side:#071117; --side-ink:#D9E7EC; --side-muted:#7E98A5; --side-hi:#123041;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--side)}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance; margin:0}
h1{font-family:var(--f-display); font-weight:700; font-size:clamp(28px,4vw,40px); line-height:1.12; letter-spacing:-.01em}
h2{font-family:var(--f-display); font-weight:600; font-size:24px; line-height:1.2}
h3{font-size:15px; font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono); font-size:.88em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; font-weight:600; color:var(--muted)}
:focus-visible{outline:2px solid var(--glow); outline-offset:2px}

/* App-skall */
.app{display:grid; grid-template-columns:252px minmax(0,1fr); min-height:100%}
.side{background:var(--side); color:var(--side-ink); position:sticky; top:env(safe-area-inset-top,0px); height:100vh; display:flex; flex-direction:column; padding:22px 14px 18px max(14px, env(safe-area-inset-left,0px)); gap:22px; overflow-y:auto}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px}
.brand svg{flex:none; margin-top:-8px}
.brand b{font-family:var(--f-display); font-size:17px; line-height:1.15; display:block; letter-spacing:.01em; color:#fff}
.brand small{display:block; font-size:11.5px; color:var(--side-muted); line-height:1.2}
.navgroup{display:flex; flex-direction:column; gap:2px}
.navgroup .eyebrow{color:var(--side-muted); padding:0 10px 6px}
.nav a{display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--side-ink); text-decoration:none; padding:8px 10px; border-radius:var(--r-s); font-size:14px}
.nav a:hover{background:var(--side-hi)}
.nav a[aria-current="page"]{background:var(--side-hi); color:#fff; box-shadow:inset 3px 0 0 var(--glow)}
.nav .cnt{font-family:var(--f-mono); font-size:11px; background:rgba(255,255,255,.1); padding:1px 7px; border-radius:20px}
.side-foot{margin-top:auto; font-size:12px; color:var(--side-muted); padding:0 10px; display:flex; flex-direction:column; gap:10px}
.side-foot button{background:transparent; color:var(--side-ink); border:1px solid #2C4A5A; border-radius:var(--r-s); padding:6px 10px; font:inherit; cursor:pointer}
.side-foot button:hover{background:var(--side-hi)}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding-block:10px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; justify-content:space-between}
.crumb{font-size:13px; color:var(--muted)}
.crumb b{color:var(--ink); font-weight:600}
.content{padding-block:28px 64px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); width:100%; max-width:1180px}
.content.narrow{max-width:980px}

/* Regelverksbryter */
.regime{display:flex; align-items:center; gap:8px; font-size:13px}
.regime[hidden]{display:none}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:var(--r-s); overflow:hidden; background:var(--surface)}
.seg button{font:inherit; font-size:12.5px; padding:5px 11px; border:0; background:transparent; color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:600}

/* Felles komponenter */
.stack{display:flex; flex-direction:column; gap:16px}
.stack-l{display:flex; flex-direction:column; gap:28px}
.row{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; min-width:0}
.panel > h3{margin-bottom:10px}
h2.h-card{font-family:var(--f-body); font-size:15px; font-weight:600; line-height:1.55; letter-spacing:0}
.panel > h2.h-card{margin-bottom:10px}
.panel-h{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:12px; flex-wrap:wrap}
.lede{font-size:17px; line-height:1.6; max-width:68ch; color:var(--ink)}
.prose{max-width:68ch; display:flex; flex-direction:column; gap:10px}
.btn{font:inherit; font-size:14px; font-weight:600; border-radius:var(--r-s); padding:8px 14px; cursor:pointer; border:1px solid var(--line); background:var(--surface); color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad); border-color:color-mix(in srgb, var(--bad) 40%, var(--line))}
.btn.sm{font-size:12.5px; padding:5px 10px}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:2px 9px; border-radius:20px; white-space:nowrap; background:var(--surface-2); color:var(--muted)}
.pill.ok{background:var(--ok-soft); color:var(--ok)} .pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad)} .pill.info{background:var(--info-soft); color:var(--info)}
.pill.acc{background:var(--accent-soft); color:var(--accent)}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor; display:inline-block}
.note{display:flex; gap:10px; align-items:flex-start; background:var(--info-soft); color:var(--ink); border-radius:var(--r-s); padding:10px 14px; font-size:13.5px}
.note b{color:var(--info)}
.note.warn{background:var(--warn-soft)} .note.warn b{color:var(--warn)}
.note.ok{background:var(--ok-soft)} .note.ok b{color:var(--ok)}
.sample{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; border:1px dashed color-mix(in srgb, var(--accent) 50%, var(--line)); background:var(--accent-soft); border-radius:var(--r-s); padding:9px 14px; font-size:13px}
.sample b{color:var(--accent)}
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:14px}
th{text-align:left; font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--surface-2); white-space:nowrap}
td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top}
tr:last-child td{border-bottom:0}
#caseRows .mono{white-space:nowrap}
.tbl-wrap table{min-width:720px}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:color-mix(in srgb, var(--accent-soft) 45%, transparent)}
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; display:flex; flex-direction:column; gap:4px; min-width:0}
.kpi .v{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.kpi .l{font-size:12.5px; color:var(--muted)}
.kpi.alert .v{color:var(--bad)}
label.f{display:flex; flex-direction:column; gap:5px; font-size:13px; font-weight:600}
label.f span.h{font-weight:400; color:var(--muted); font-size:12.5px}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:var(--r-s); background:var(--surface); color:var(--ink); width:100%}
textarea{min-height:120px; resize:vertical; line-height:1.5}
.choice{display:flex; flex-wrap:wrap; gap:8px}
.choice label{display:flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:var(--r-s); padding:7px 11px; font-size:13.5px; cursor:pointer; background:var(--surface)}
.choice label:has(input:checked){border-color:var(--accent); background:var(--accent-soft)}
.choice input{accent-color:var(--accent); margin:0}
.chk{display:flex; gap:9px; align-items:flex-start; font-size:14px; padding:7px 0; border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk input{accent-color:var(--accent); margin-top:4px}
.chk small{display:block; color:var(--muted); font-size:12.5px}
.ev{display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:start; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px}
.ev:last-child{border-bottom:0}
.ev .src{font-size:12px; color:var(--muted)}
.ico{width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700}
.ico.ok{background:var(--ok-soft); color:var(--ok)} .ico.bad{background:var(--bad-soft); color:var(--bad)} .ico.warn{background:var(--warn-soft); color:var(--warn)} .ico.na{background:var(--surface-2); color:var(--muted)}

/* Fristklokke */
.clock{display:flex; gap:14px; align-items:center}
.clock .ring{--p:0; width:64px; height:64px; border-radius:50%; background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%), var(--surface-2) 0); display:grid; place-items:center; flex:none}
.clock .ring i{width:48px; height:48px; border-radius:50%; background:var(--surface); display:grid; place-items:center; font-style:normal; font-weight:700; font-size:15px; font-variant-numeric:tabular-nums}
.deadline{font-variant-numeric:tabular-nums; white-space:nowrap}
.deadline.bad{color:var(--bad); font-weight:600} .deadline.warn{color:var(--warn); font-weight:600}

/* Triage */
.triage{border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.triage .head{padding:14px 18px; display:flex; flex-direction:column; gap:4px; border-bottom:1px solid var(--line)}
.triage .head.t-uaut{background:var(--info-soft)} .triage .head.t-psr{background:var(--ok-soft)} .triage .head.t-autbank{background:var(--warn-soft)} .triage .head.t-annen{background:var(--surface-2)} .triage .head.t-ukjent{background:var(--surface-2)}
.triage .head b{font-size:16px}
.triage ol{margin:0; padding:12px 18px 14px 38px; display:flex; flex-direction:column; gap:6px; font-size:14px}
.triage .basis{padding:0 18px 14px; font-size:12.5px; color:var(--muted)}
.suggest{border-left:3px solid var(--accent); background:var(--accent-soft); padding:12px 16px; border-radius:0 var(--r-s) var(--r-s) 0; display:flex; flex-direction:column; gap:6px}
.suggest b{font-size:15px}

/* Tidslinje / logg */
.log{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.log li{display:grid; grid-template-columns:96px minmax(0,1fr); gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px}
.log li:last-child{border-bottom:0}
.log time{color:var(--muted); font-variant-numeric:tabular-nums; font-size:12.5px}

/* Behov-kort og prosess */
.needs{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.need{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; display:grid; grid-template-columns:34px minmax(0,1fr); gap:4px 12px}
.need .k{font-family:var(--f-mono); font-size:12px; color:var(--accent); font-weight:500; padding-top:2px}
.need h3{font-size:15px}
.need p{grid-column:2; font-size:13.5px; color:var(--muted)}
.need a{grid-column:2; font-size:13px; font-weight:600; text-decoration:none}
.steps{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; counter-reset:s}
.step{padding:16px 18px 16px 0; border-top:3px solid var(--line); position:relative; display:flex; flex-direction:column; gap:6px}
.step.on{border-top-color:var(--accent)}
.step .eyebrow{color:var(--accent)}
.step p{font-size:13.5px; color:var(--muted)}
.hero{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:28px; align-items:end; padding-bottom:6px}
.meta{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px}
.meta dt{color:var(--muted)} .meta dd{margin:0; font-weight:500}

/* Business case */
.bc{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px}
.slider{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; padding:8px 0; border-bottom:1px solid var(--line)}
.slider:last-child{border-bottom:0}
.slider label{font-size:13.5px}
.slider output{font-variant-numeric:tabular-nums; font-weight:600; font-size:13.5px; text-align:right}
.slider input{grid-column:1 / -1; accent-color:var(--accent); width:100%}
.slider small{grid-column:1 / -1; color:var(--muted); font-size:12px}
.bcline{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px}
.bcline span:last-child{font-variant-numeric:tabular-nums; font-weight:600; text-align:right}
.bcline.tot{border-bottom:0; border-top:2px solid var(--ink); font-size:16px; padding-top:12px}
.bcbar{height:12px; border-radius:6px; background:var(--surface-2); overflow:hidden; display:flex}
.bcbar i{display:block; height:100%}

/* Diagram */
.arch{overflow-x:auto}
.arch svg{min-width:720px; width:100%; height:auto; display:block}
.arch text{font-family:var(--f-body)}

/* Gantt */
.gantt{display:grid; grid-template-columns:200px minmax(0,1fr); gap:8px 14px; align-items:center; font-size:13.5px}
.gantt .track{position:relative; height:26px; background:var(--surface-2); border-radius:4px}
.gantt .bar{position:absolute; top:3px; bottom:3px; border-radius:3px; background:var(--accent); color:var(--accent-ink); font-size:11.5px; font-weight:600; display:flex; align-items:center; padding:0 8px; white-space:nowrap; overflow:hidden}
.gantt .bar.alt{background:var(--glow); color:#04222A}
.gantt .bar.ghost{background:transparent; border:1.5px dashed var(--accent); color:var(--accent)}
.gantt .scale{position:relative; height:16px; font-size:11.5px; color:var(--muted); font-family:var(--f-mono)}
.gantt .scale span{position:absolute; transform:translateX(-50%)} .gantt .scale span:first-child{transform:none} .gantt .scale span:last-child{transform:translateX(-100%)}
.gantt .lab small{display:block; font-size:12px; color:var(--muted); font-weight:400}

/* Søyler */
.bars{display:flex; flex-direction:column; gap:8px}
.bars .b{display:grid; grid-template-columns:150px minmax(0,1fr) 54px; gap:10px; align-items:center; font-size:13px}
.bars .b .t{height:14px; background:var(--surface-2); border-radius:3px; overflow:hidden}
.bars .b .t i{display:block; height:100%; background:var(--accent); border-radius:3px}
.bars .b span:last-child{text-align:right; font-variant-numeric:tabular-nums; font-weight:600}
.cols{display:flex; align-items:flex-end; gap:10px; height:170px; padding-top:8px; border-bottom:1px solid var(--line)}
.cols .c{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; height:100%; min-width:0}
.cols .c .stk{width:100%; max-width:44px; display:flex; flex-direction:column-reverse; border-radius:3px 3px 0 0; overflow:hidden}
.cols .c .stk i{display:block; width:100%}
.cols .c b{font-size:12px; font-variant-numeric:tabular-nums}
.colx{display:flex; gap:10px; font-size:11.5px; color:var(--muted)} .colx span{flex:1; text-align:center}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.5px; color:var(--muted)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px}

.toast{position:fixed; right:max(20px, calc(env(safe-area-inset-right,0px) + 20px)); bottom:calc(env(safe-area-inset-bottom,0px) + 20px); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:var(--r-s); font-size:14px; z-index:20; box-shadow:0 6px 24px rgba(0,0,0,.2)}
.filters{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.split{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:20px; align-items:start}
.sticky{position:sticky; top:72px}
.sources li{margin-bottom:6px; font-size:13.5px}
.hr{height:1px; background:var(--line); border:0; margin:4px 0}

@media (max-width:1080px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .split{grid-template-columns:minmax(0,1fr)} .sticky{position:static} .hero{grid-template-columns:minmax(0,1fr)} .bc{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center; gap:10px 16px; padding:12px max(16px, env(safe-area-inset-right,0px)) 12px max(16px, env(safe-area-inset-left,0px))}
  .navgroup{flex-direction:row; flex-wrap:wrap; gap:4px; width:100%}
  .navgroup .eyebrow{display:none}
  .nav a{padding:6px 10px; font-size:13px}
  .nav .cnt{display:none}
  .side-foot{display:none}
  .topbar{position:static}
  .grid2,.grid3,.needs{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gantt{grid-template-columns:minmax(0,1fr)} .gantt .lab{font-weight:600}
}

<script>
// ---------- Hjelpere ----------
const $ = (s, r=document) => r.querySelector(s);

const store = {
  get(k, f){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; }catch(e){ return f; } },

// ---------- Språk ----------
let LANG = (() => { try{ const v = sessionStorage.getItem('cg_lang'); if(v==='no'||v==='en') return v; }catch(e){} return 'en'; })();

const mill = n => LANG === 'en' ? 'NOK ' + (n/1e6).toLocaleString('en-GB', {minimumFractionDigits:1, maximumFractionDigits:1}) + 'm' : (n/1e6).toLocaleString('nb-NO', {minimumFractionDigits:1, maximumFractionDigits:1}) + ' mill. kr';

const dec = (v, max=1) => Number(v).toLocaleString(LOC(), {maximumFractionDigits:max});
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseIso = s => { if(!s || typeof s !== 'string') return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };

const SHELL = {
  mainMenu:['Hovedmeny','Main menu'], brandSub:['Svindelkrav · Morild Bank','Fraud claims · Morild Bank'],
  grpProposal:['Løsningsforslag','Solution proposal'], grpDemo:['Konseptdemo','Concept demo'],
  forslag:['Introduksjon','Introduction'], behov:['Fra behov til løsning','From needs to solution'], 'veien-videre':['Veien videre','Next steps'], om:['Om løsningsforslaget','About the proposal'],

};

// ---------- Virkedager (norske helligdager) ----------
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da); }
const _hol = {};
function holidays(y){
  if(_hol[y]) return _hol[y];
  const e = easter(y), add = n => { const d = new Date(e); d.setDate(d.getDate()+n); return iso(d); };
  return _hol[y] = new Set([`${y}-01-01`, add(-3), add(-2), add(1), `${y}-05-01`, `${y}-05-17`, add(39), add(50), `${y}-12-25`, `${y}-12-26`]);
}
const isBiz = d => d.getDay()!==0 && d.getDay()!==6 && !holidays(d.getFullYear()).has(iso(d));
function addBiz(d, n){ const r = new Date(d); const s = n>=0?1:-1; let k = Math.abs(n); while(k>0){ r.setDate(r.getDate()+s); if(isBiz(r)) k--; } return r; }
function bizBetween(a, b){
  if(+b === +a) return 0; const s = b>a?1:-1; let n=0; const r = new Date(a);
  while((s>0 && r<b) || (s<0 && r>b)){ r.setDate(r.getDate()+s); if(isBiz(r)) n+=s; } return n; }
const TODAY = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); })();
const daysAgo = n => { const d = new Date(TODAY); d.setDate(d.getDate()-n); return d; };

// ---------- Kodeverk ----------
const AVSENDER = { bank:['Morild Bank','Morild Bank'], politi:['Politi / Kripos','Police / Kripos'], annen:['Annen aktør (Posten, Nav, e.l.)','Other party (Posten, Nav, etc.)'], invest:['Investeringstilbud','Investment offer'], ingen:['Ingen kjent','None known'] };
const KANAL = { telefon:['Telefonsamtale','Phone call'], sms:['SMS','Text message'], epost:['E-post','Email'], chat:['Melding / sosiale medier','Message / social media'], nett:['Nettside / annonse','Website / ad'] };

  ny:{t:['Ny','New'], c:'info'}, vurdering:{t:['Under vurdering','Under review'], c:'acc'}, 'venter-kunde':{t:['Venter på kunde','Awaiting customer'], c:'warn'},
  'venter-politi':{t:['Venter på politianmeldelse','Awaiting police report'], c:'warn'}, refundert:{t:['Refundert','Refunded'], c:'ok'}, delvis:{t:['Delvis refundert','Partly refunded'], c:'ok'},
  avslatt:{t:['Avslått','Rejected'], c:'bad'}, finkn:{t:['Klaget til Finansklagenemnda','Appealed to complaints board'], c:'bad'}
};
const av = k => L(...AVSENDER[k]), ka = k => L(...KANAL[k]), st = k => L(...STATUS[k].t);
const OPEN = new Set(['ny','vurdering','venter-kunde','venter-politi']);
const Lg = (no, en) => ({no, en}); // tospråklig logglinje

// ---------- Eksempeldata ----------
function rng(seed){ let s = seed>>>0; return () => { s = (s*1664525 + 1013904223)>>>0; return s/4294967296; }; }
const FN = ['Ingrid','Ola','Kari','Per','Aud','Jonas','Sigrid','Arne','Liv','Bjørn','Randi','Erik','Turid','Magnus','Solveig','Henrik','Berit','Knut','Marit','Tor','Astrid','Lars','Gunn','Even','Hilde','Rolf','Nora','Svein','Eli','Odd'];
const LN = ['Solheim','Berg','Hansen','Nilsen','Lie','Dahl','Haugen','Bakke','Strand','Moen','Eide','Lund','Vik','Aas','Holm','Sæther','Myhre','Brekke','Hagen','Rønning'];
const MOTTAK = ['Revolut Bank UAB','Nordlys Sparebank','Bank Norwegian','Wise Europe','Fjordkyst Bank','N26 Bank','Skagerak Sparebank','Lunar Bank'];

function makeCase(o){
  return Object.assign({
    id:'', kunde:'', alder:0, belop:0, betalt:null, meldt:null, politi:null, kanal:'telefon', avsender:'bank', bankKanal:true,
    utfortAv:'kunde', antallBet:1, mottaker:'', ind:{koder:false, advarsel:false, gjentatt:false, forsett:false, overvaking:false, vop:false, nyEnhet:false, spoof:false},
    status:'ny', beslutning:null, refundert:0, tilbakefort:0, tilbakekall:'ikke', avgjort:null, forklaring:'', logg:[], showcase:false

}
const L_REG = { kundesenter:Lg('Krav registrert av kundesenter','Claim registered by customer centre'), registrert:Lg('Krav registrert','Claim registered'), recall:Lg('Tilbakekall sendt til mottakerbank via Kystlys Case Desk','Recall sent to receiving bank via Kystlys Case Desk') };

function seedCases(){
  const r = rng(20261108);
  const pick = a => a[Math.floor(r()*a.length)];
  const cases = [];
  for(let i=0;i<118;i++){
    const ago = 12 + Math.floor(r()*140);
    const meldt = daysAgo(ago); while(!isBiz(meldt)) meldt.setDate(meldt.getDate()-1);
    const x = r();
    const avsender = x<.46?'bank':x<.62?'politi':x<.80?'invest':x<.92?'annen':'ingen';
    const utfortAv = (avsender==='bank' && r()<.42) ? 'svindler' : (r()<.12?'svindler':'kunde');
    const kanal = avsender==='bank' ? (r()<.78?'telefon':'sms') : avsender==='invest' ? (r()<.6?'nett':'chat') : pick(['telefon','sms','epost','chat']);
    const belop = Math.round((avsender==='invest' ? 40000+r()*260000 : 6000+r()*120000)/100)*100;
    const koder = utfortAv==='svindler' ? r()<.85 : r()<.15;
    const ind = { koder, advarsel:r()<.3, gjentatt:r()<.32, forsett:r()<.02, overvaking:r()<.4, vop:r()<.35, nyEnhet:utfortAv==='svindler' ? r()<.9 : r()<.1, spoof: avsender==='bank' && kanal==='telefon' && r()<.7 };
    let status, refundert=0, beslutning;
    if(utfortAv==='svindler'){ const g = ind.koder && (ind.advarsel||ind.gjentatt); status = ind.forsett?'avslatt':(g?'delvis':'refundert'); refundert = status==='avslatt'?0:belop-(g?12000:450); beslutning = status; }
    else { const y = r(); status = y<.18?'refundert':y<.30?'delvis':y<.92?'avslatt':'finkn'; refundert = status==='refundert'?belop:status==='delvis'?Math.round(belop*.5/100)*100:0; beslutning = status==='finkn'?'avslatt':status; }
    const tk = r(); const tilbakefort = tk<.27 ? Math.round(belop*(.3+r()*.7)/100)*100 : 0;
    const avgjort = addBiz(meldt, 2+Math.floor(r()*9));
    cases.push(makeCase({ kunde:`${pick(FN)} ${pick(LN)}`, alder:22+Math.floor(r()*62), belop, betalt:addBiz(meldt,-1), meldt,
      politi: r()<.8 ? addBiz(meldt, Math.floor(r()*3)) : null, kanal, avsender, bankKanal: avsender==='bank' ? r()<.85 : false, utfortAv, antallBet: ind.gjentatt?2+Math.floor(r()*3):1,
      mottaker:pick(MOTTAK), ind, status, beslutning, refundert:Math.max(0,refundert), tilbakefort, tilbakekall: tilbakefort?'delvis':'avvist', avgjort,
      logg:[{d:meldt, t:L_REG.kundesenter},{d:avgjort, t:{dec:status}}] }));
  }
  cases.sort((a,b) => a.meldt - b.meldt);
  cases.forEach((c,i) => c.id = `MB-${c.meldt.getFullYear()}-${String(200+i).padStart(4,'0')}`);
  let n = 200 + cases.length;
  const id = () => `MB-${TODAY.getFullYear()}-${String(n++).padStart(4,'0')}`;
  const today0 = isBiz(TODAY) ? TODAY : addBiz(TODAY, -1);

  const open = [
    makeCase({ showcase:true, kunde:'Ingrid Solheim', alder:71, belop:84500, betalt:addBiz(today0,-3), meldt:addBiz(today0,-3), politi:addBiz(today0,-2), kanal:'telefon', avsender:'bank', bankKanal:true, utfortAv:'kunde', antallBet:2, mottaker:'Revolut Bank UAB',
      ind:{koder:false, advarsel:false, gjentatt:false, forsett:false, overvaking:true, vop:true, nyEnhet:false, spoof:true}, status:'vurdering', tilbakekall:'sendt',
      forklaring:Lg('Kunden ble oppringt fra et nummer som viste «Morild Bank 915 10 000». Innringer sa at kontoen var angrepet og ba henne flytte pengene til en «sikker konto». Hun godkjente to overføringer selv i nettbanken.',
                    'The customer was called from a number displayed as "Morild Bank 915 10 000". The caller said her account had been attacked and asked her to move the money to a "safe account". She approved two transfers herself in online banking.'),
      logg:[{d:addBiz(today0,-3), t:Lg('Krav registrert av kundesenter (telefon)','Claim registered by customer centre (phone)')},{d:addBiz(today0,-3), t:L_REG.recall},{d:addBiz(today0,-2), t:Lg('Politianmeldelse mottatt (anmeldelsesnr. 26-184 552)','Police report received (report no. 26-184 552)')},{d:addBiz(today0,-2), t:Lg('Teleoperatør bekreftet falskt avsendernummer','Telecom operator confirmed spoofed caller number')}] }),
    makeCase({ showcase:true, kunde:'Jonas Berg', alder:34, belop:23900, betalt:addBiz(today0,-1), meldt:today0, politi:today0, kanal:'sms', avsender:'bank', bankKanal:true, utfortAv:'svindler', antallBet:1, mottaker:'Wise Europe',
      ind:{koder:true, advarsel:true, gjentatt:false, forsett:false, overvaking:false, vop:false, nyEnhet:true, spoof:false}, status:'ny', tilbakekall:'sendt',
      forklaring:Lg('Kunden fikk SMS i samme tråd som Morild Banks ekte meldinger, med lenke til en falsk innloggingsside. Han oppga BankID-kode og passord. Betalingen ble utført fra en ny enhet han ikke kjenner.',
                    'The customer received a text in the same thread as Morild Bank’s genuine messages, with a link to a fake login page. He entered his BankID code and password. The payment was made from a new device he does not recognise.'),
      logg:[{d:today0, t:Lg('Krav registrert via nettbank-skjema','Claim registered via online banking form')},{d:today0, t:L_REG.recall}] }),
    makeCase({ showcase:true, kunde:'Aud Hansen', alder:79, belop:150000, betalt:addBiz(today0,-4), meldt:addBiz(today0,-4), politi:addBiz(today0,-4), kanal:'telefon', avsender:'politi', bankKanal:false, utfortAv:'kunde', antallBet:3, mottaker:'Fjordkyst Bank',
      ind:{koder:false, advarsel:false, gjentatt:true, forsett:false, overvaking:true, vop:true, nyEnhet:false, spoof:false}, status:'vurdering', tilbakekall:'delvis', tilbakefort:41000,
      forklaring:Lg('Innringer presenterte seg som etterforsker i Kripos og sa at bankansatte var involvert i svindel. Kunden ble bedt om ikke å kontakte banken og overførte penger til en «beskyttet konto» i tre omganger.',
                    'The caller introduced himself as a Kripos investigator and said bank employees were involved in fraud. The customer was told not to contact the bank and transferred money to a "protected account" in three rounds.'),
      logg:[{d:addBiz(today0,-4), t:Lg('Krav registrert i filial','Claim registered at branch')},{d:addBiz(today0,-4), t:Lg('Politianmeldelse mottatt','Police report received')},{d:addBiz(today0,-3), t:Lg('Mottakerbank tilbakeførte 41 000 kr','Receiving bank returned NOK 41,000')}] }),
    makeCase({ showcase:true, kunde:'Erik Lund', alder:52, belop:210000, betalt:addBiz(today0,-6), meldt:addBiz(today0,-5), politi:null, kanal:'nett', avsender:'invest', bankKanal:false, utfortAv:'kunde', antallBet:4, mottaker:'Lunar Bank',
      ind:{koder:false, advarsel:true, gjentatt:true, forsett:false, overvaking:false, vop:false, nyEnhet:false, spoof:false}, status:'venter-kunde', tilbakekall:'avvist',
      forklaring:Lg('Kunden investerte i en kryptoplattform etter en annonse på sosiale medier. Han betalte fire ganger over tre uker og ble advart av nettbanken før den siste betalingen.',
                    'The customer invested in a crypto platform after an ad on social media. He paid four times over three weeks and was warned by online banking before the last payment.'),
      logg:[{d:addBiz(today0,-5), t:L_REG.kundesenter},{d:addBiz(today0,-4), t:Lg('Mottakerbank avviste tilbakekall (midlene var tatt ut)','Receiving bank rejected recall (funds already withdrawn)')},{d:addBiz(today0,-3), t:Lg('Ba kunden om kontoutskrift fra plattformen','Asked the customer for a statement from the platform')}] })
  ];
  const r2 = rng(77);
  const pk = a => a[Math.floor(r2()*a.length)];
  const more = [
    ['bank','telefon','kunde',true, 12, 'vurdering'], ['bank','sms','svindler',true, 1, 'ny'], ['politi','telefon','kunde',false, 6, 'vurdering'],
    ['bank','telefon','kunde',true, 2, 'venter-politi'], ['annen','sms','svindler',false, 0, 'ny'], ['bank','chat','kunde',false, 7, 'vurdering'],
    ['bank','telefon','svindler',true, 1, 'vurdering'], ['invest','chat','kunde',false, 9, 'vurdering'], ['bank','telefon','kunde',true, 14, 'vurdering']
  ];
  more.forEach(([a,k,ut,bk,ago,s]) => {
    const meldt = addBiz(today0, -ago);
    open.push(makeCase({ kunde:`${pk(FN)} ${pk(LN)}`, alder:25+Math.floor(r2()*60), belop:Math.round((8000+r2()*110000)/100)*100, betalt:addBiz(meldt,-1), meldt,
      politi: s==='venter-politi' ? null : (r2()<.85 ? meldt : null), kanal:k, avsender:a, bankKanal:bk, utfortAv:ut, mottaker:pk(MOTTAK),
      ind:{koder: ut==='svindler', advarsel:r2()<.3, gjentatt:r2()<.3, forsett:false, overvaking:r2()<.45, vop:r2()<.4, nyEnhet: ut==='svindler', spoof: a==='bank' && k==='telefon' && bk},
      status:s, tilbakekall: r2()<.5 ? 'sendt' : 'avvist', logg:[{d:meldt, t:L_REG.registrert}] }));
  });

}

// ---------- Tilstand ----------
let MODE = store.get('cg_mode', 'now'); if(MODE !== 'now' && MODE !== 'psr') MODE = 'now';
let CASES = [];
function reviveCase(c){ ['betalt','meldt','politi','avgjort'].forEach(k => c[k] = c[k] ? parseIso(c[k]) : null); c.logg = (c.logg||[]).map(l => ({d:parseIso(l.d), t:l.t})); return makeCase(c); }
function serialize(c){ const o = {...c}; ['betalt','meldt','politi','avgjort'].forEach(k => o[k] = c[k] ? iso(c[k]) : null); o.logg = c.logg.map(l => ({d:iso(l.d), t:l.t})); return o; }
function loadCases(){
  CASES = seedCases();
  // Lagrede endringer brukes bare hvis de gir en gyldig sak; ødelagte data i nettleseren ignoreres.
  const plain = v => v && typeof v === 'object' && !Array.isArray(v);
  let changes = store.get('cg_changes', {}); if(!plain(changes)) changes = {};
  let added = store.get('cg_added', []); if(!Array.isArray(added)) added = [];
  const safe = o => { try{ const c = reviveCase(o); return validCase(c) ? c : null; }catch(e){ return null; } };
  CASES = CASES.map(c => plain(changes[c.id]) ? (safe({...serialize(c), ...changes[c.id]}) || c) : c);
  added.forEach(a => { if(plain(a) && !byId(a.id)){ const c = safe(a); if(c) CASES.push(c); } });
}
function validCase(c){
  const okDate = d => d instanceof Date && !isNaN(d);
  return typeof c.id === 'string' && /^MB-\d{4}-\d{4}$/.test(c.id) && typeof c.kunde === 'string' && Number.isFinite(c.belop) && c.belop >= 0
    && okDate(c.meldt) && ['betalt','politi','avgjort'].every(k => c[k] === null || okDate(c[k]))
    && STATUS[c.status] && AVSENDER[c.avsender] && KANAL[c.kanal] && ['kunde','svindler','usikker'].includes(c.utfortAv)
    && plain2(c.ind) && Array.isArray(c.logg) && c.logg.every(l => okDate(l.d)) && Number.isFinite(c.refundert) && Number.isFinite(c.tilbakefort);
}
function plain2(v){ return v && typeof v === 'object' && !Array.isArray(v); }
function saveCase(c){
  if(c.added){ const added = store.get('cg_added', []).filter(a => a.id !== c.id); added.push(serialize(c)); store.set('cg_added', added); }
  else { const ch = store.get('cg_changes', {}); ch[c.id] = serialize(c); store.set('cg_changes', ch); }
}
const byId = id => CASES.find(c => c.id === id);

function logText(t){
  if(t && t.dec){ const base = L('Beslutning: ','Decision: ') + st(t.dec) + (t.amt ? ` (${nok(t.amt)})` : '');
    if(t.reg) return base + L(`. Regelverk: ${t.reg.no}`, `. Rules: ${t.reg.en}`) + (t.accepted ? L('. Forslaget ble godtatt.','. The suggestion was accepted.') : L('. Saksbehandler valgte selv.','. Chosen by case handler.'));
    return base; }

}

function suggest(c, t = triage(c)){
  const i = c.ind; const grov = i.koder && (i.advarsel || i.gjentatt); const objektiv = i.advarsel && i.gjentatt;
  if(t.regime === 'uaut'){
    if(i.forsett) return { k:'avslatt', amount:0, title:L('Avslå: mistanke om forsett','Reject: suspected intent'), why:[L('Det er indikasjoner på at kunden selv har medvirket. Dokumenter grunnlaget og meld forholdet til politiet.','There are indications that the customer took part. Document the grounds and report the matter to the police.')] };
    if(grov) return { k:'delvis', amount:Math.max(0, c.belop-12000), title:L(`Refunder ${nok(Math.max(0,c.belop-12000))} (egenandel 12 000 kr)`,`Refund ${nok(Math.max(0,c.belop-12000))} (excess NOK 12,000)`),
      why:[ L('Kunden har delt BankID-kode' + (i.advarsel ? ' og overstyrt en advarsel' : ' og latt flere betalinger gå'), 'The customer shared a BankID code' + (i.advarsel ? ' and overrode a warning' : ' and let several payments go through')),
            L('Det tilsier grov uaktsomhet, men ikke forsett. Jf. HR-2022-1752-A.','This indicates gross negligence, but not intent. See HR-2022-1752-A.') ] };
    return { k:'refundert', amount:Math.max(0, c.belop-450), title:L(`Refunder ${nok(Math.max(0,c.belop-450))} (egenandel 450 kr)`,`Refund ${nok(Math.max(0,c.belop-450))} (excess NOK 450)`), why:[L('Ingen tegn til grov uaktsomhet. Hovedregelen om tilbakeføring gjelder.','No signs of gross negligence. The main rule on refunds applies.')] };
  }
  if(t.regime === 'psr'){
    if(!c.politi) return { k:'venter-politi', amount:0, title:L('Be kunden levere politianmeldelse','Ask the customer for a police report'), why:[L('Refusjonsretten forutsetter at kunden har meldt saken til politiet. Fristen starter når anmeldelsen er mottatt.','The refund right requires the customer to have reported the matter to the police. The deadline starts when the report is received.')] };
    if(objektiv) return { k:'avslatt', amount:0, title:L('Vurder begrunnet avslag','Consider a justified refusal'), why:[L('Kunden overstyrte en konkret advarsel og gjennomførte flere betalinger.','The customer overrode a specific warning and made several payments.'), L('Gi kunden anledning til å forklare seg før beslutning. Opplys om Finansklagenemnda ved avslag.','Give the customer a chance to explain before deciding. Inform about the complaints board if refused.')] };
    return { k:'refundert', amount:c.belop, title:L(`Refunder hele beløpet (${nok(c.belop)})`,`Refund the full amount (${nok(c.belop)})`), why:[L('Vilkårene er oppfylt: imitasjon av banken via bankens kanal, varsel og politianmeldelse foreligger.','The conditions are met: impersonation of the bank via the bank’s channel, notification and police report are in place.'), L('Ingen objektive grunner til å mistenke grov uaktsomhet.','No objective grounds to suspect gross negligence.')] };
  }
  if(t.regime === 'autbank' || t.regime === 'annen'){
    if(i.overvaking || i.vop){
      const sig = LANG==='en' ? [i.overvaking && 'fraud monitoring raised an alert', i.vop && 'the payee name check showed a mismatch'].filter(Boolean).join(' and ')
                              : [i.overvaking && 'svindelovervåkningen ga varsel', i.vop && 'navnekontrollen viste avvik'].filter(Boolean).join(' og ');
      return { k:'vurdering', amount:0, title:L('Vurder bankens ansvar','Assess the bank\u2019s liability'), why:[
        L(`Bankens egne signaler: ${sig}, uten at betalingen ble stanset.`,`The bank\u2019s own signals: ${sig}, without the payment being stopped.`),
        L('Finansklagenemnda har gitt banken ansvar fra tidspunktet den hadde klar mistanke, med reduksjon for kundens egen skyld (FinKN 2026-5). Beløpet fastsettes konkret i saken.','The complaints board has held the bank liable from the point it had clear suspicion, reduced for the customer\u2019s own fault (FinKN 2026-5). The amount is set case by case.')] };
    }
    if(c.avsender === 'politi') return { k:'vurdering', amount:0, title:L('Vurder om samtykket var gyldig','Assess whether the consent was valid'), why:[L('Se FinKN 2024-309. Kunden ble isolert fra banken og presset av falsk politietterforsker.','See FinKN 2024-309. The customer was isolated from the bank and pressured by a fake police investigator.')] };
    return { k:'avslatt', amount:0, title:L('Avslå med begrunnelse','Reject with reasons'), why:[L('Ingen lovfestet refusjonsrett, og ingen signaler som tilsier at banken burde ha stanset betalingen.','No statutory refund right, and no signals suggesting the bank should have stopped the payment.'), L('Opplys om Finansklagenemnda og fortsett tilbakekall fra mottakerbank.','Inform about the complaints board and continue the recall from the receiving bank.')] };
  }
  return { k:'vurdering', amount:0, title:L('Avklar hvem som utførte betalingen','Clarify who made the payment'), why:[L('Regelverket kan ikke fastsettes før dette er klart.','The applicable rules cannot be set until this is clear.')] };
}

const BC_DEF = { krav:420, tidNa:6, tidNy:2.5, timekost:850, klager:30, klagerRed:30, klageKost:30000, svindlet:17, tilbake:4, lisens:950000, engang:1400000 };

function bcCalc(p){
  const tid = p.krav * (p.tidNa - p.tidNy) * p.timekost;
  const klage = p.klager * (p.klagerRed/100) * p.klageKost;
  const tilb = p.svindlet*1e6 * (p.tilbake/100);
  const brutto = tid + klage + tilb; const netto = brutto - p.lisens;
  const payback = netto > 0 ? p.engang / netto * 12 : null;
  const fem = netto*5 - p.engang;
  return { tid, klage, tilb, brutto, netto, payback, fem, timer: p.krav*(p.tidNa-p.tidNy) };
}

AFTER.sak = (id) => {
  const c = byId(id); if(!c) return;
  $$('[data-ind]').forEach(cb => cb.addEventListener('change', () => { const k = cb.dataset.ind;
    c.ind[k] = cb.checked; c.logg.push({d:TODAY, t:Lg(`Aktsomhet endret: ${NEGL[k][0]} = ${cb.checked?'ja':'nei'}`, `Diligence changed: ${NEGL[k][1]} = ${cb.checked?'yes':'no'}`)}); if(c.status==='ny') c.status='vurdering'; saveCase(c); render(); }));
  $('#copyLetter')?.addEventListener('click', () => { const ta = $('#letter'); const fail = () => { ta.select(); toast(L('Merk teksten og kopier manuelt','Select the text and copy manually')); };
    try{ navigator.clipboard ? navigator.clipboard.writeText(ta.value).then(() => toast(L('Brevteksten er kopiert','The letter text has been copied')), fail) : fail(); }catch(e){ fail(); } });
  $$('[data-dec]').forEach(b => b.addEventListener('click', () => {
    const t = triage(c), s = suggest(c, t); let k = b.dataset.dec, amt;
    if(k==='accept'){ k = s.k; amt = s.amount; }
    else if(k==='refundert') amt = t.regime==='uaut' ? c.belop-450 : c.belop;
    else if(k==='delvis'){
      if(t.regime==='uaut') amt = Math.max(0,c.belop-12000);
      else { amt = Number($('#partAmt')?.value); if(!(amt>0 && amt<=c.belop)){ $('#partAmt')?.focus(); return toast(L('Fyll inn beløp for delvis refusjon','Enter the amount for the partial refund')); } }
    }
    else amt = 0;
    if(k==='vurdering'){ c.status='vurdering'; c.logg.push({d:TODAY, t:Lg('Forslag godtatt: fortsett vurdering','Suggestion accepted: continue review')}); saveCase(c); render(); toast(L('Saken er satt til vurdering','The case is set to review')); return; }
    c.status = k; c.refundert = ['refundert','delvis'].includes(k) ? amt : 0;
    if(!OPEN.has(k)){ c.avgjort = TODAY; c.beslutning = k; }
    c.logg.push({d:TODAY, t:{dec:k, amt:c.refundert, reg:t.shortObj, accepted:b.dataset.dec==='accept'}});
    saveCase(c); render(); toast(OPEN.has(k) ? `Status: ${st(k)}` : L('Beslutningen er lagret, og brevet er klart','The decision is saved, and the letter is ready'));
  }));
};

        <tr><td><b>${L('Sum','Total')}</b></td><td ${tr}><b>${all.length}</b></td><td ${tr}><b>${nok(sum(all))}</b></td><td ${tr}><b>${nok(tilb)}</b></td></tr>
      </tbody></table></div>
      <p class="muted" style="font-size:12.5px">${L('Finanstilsynet ber om brutto svindlet beløp per halvår. Kategoriene tilpasses rapporteringsmalen i piloten.','Finanstilsynet asks for the gross amount defrauded per half-year. The categories will be adapted to the reporting template in the pilot.')}</p></section>
    <section class="stack"><h2>${L('Signaler til teleoperatører','Signals to telecom operators')}</h2>
      <div class="note"><b>${L('Samarbeid','Collaboration')}</b><span>${L('Bekreftede falske avsendernumre deles med teleoperatørene. Fra 1.7.2026 gir finansforetaksloven utvidet adgang til å dele slike opplysninger.','Confirmed spoofed caller numbers are shared with telecom operators. From 1 July 2026 the Financial Institutions Act gives wider access to share such information.')}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>${L('Sak','Case')}</th><th>${L('Meldt','Reported')}</th><th>${L('Nummer vist for kunden','Number shown to the customer')}</th><th>Status</th></tr></thead><tbody>
        ${spoofs.slice(0,6).map((c,i) => `<tr><td class="mono">${c.id}</td><td>${fmtDs(c.meldt)}</td><td>915 10 000 (${L('Morild Bank kundesenter','Morild Bank customer centre')})</td><td><span class="pill ${i<2?'warn':'ok'}">${i<2?L('Sendt til operatør','Sent to operator'):L('Bekreftet og blokkert','Confirmed and blocked')}</span></td></tr>`).join('')}
      </tbody></table></div></section>
  </div>`;
}

// ---------- Oppstart ----------
function setMode(m){ MODE = m; store.set('cg_mode', m); render(); toast(m==='psr' ? L('PSR-regler er slått på (simulert)','PSR rules are switched on (simulated)') : L('Gjeldende rett er valgt','Current law is selected')); }
function setLang(l){ LANG = l; try{ sessionStorage.setItem('cg_lang', l); }catch(e){} render(); }
$('#modeNow').addEventListener('click', () => setMode('now'));
$('#modePsr').addEventListener('click', () => setMode('psr'));
$$('#langSwitch button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
$('#resetBtn').addEventListener('click', () => { ['cg_changes','cg_added','cg_draft','cg_bc','cg_mode'].forEach(store.del); MODE='now'; BC={...BC_DEF}; DRAFT={...DRAFT_DEF}; loadCases(); render(); toast(L('Demodataene er tilbakestilt','The demo data has been reset')); });
window.addEventListener('hashchange', render);
loadCases(); render();
</script>
</body>
